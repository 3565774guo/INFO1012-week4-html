<!DOCTYPE html>
<html lang="en">
<body>
    <input type="number" id="num1Input" placeholder="输入第一个数">
    <input type="number" id="num2Input" placeholder="输入第二个数">
    <br><br>
    <button id="add">加法</button>
    <button id="sub">减法</button>
    <button id="mul">乘法</button>
    <button id="div">除法</button>
    <div id="resultBox"></div>

<script>
//加法
document.getElementById('add').addEventListener('click',function(){
    let n1 = Number(num1Input.value);
    let n2 = Number(num2Input.value);
    let res = n1 + n2;
    resultBox.innerText = `Result: ${res}`;
})
//减法
document.getElementById('sub').addEventListener('click',function(){
    let n1 = Number(num1Input.value);
    let n2 = Number(num2Input.value);
    let res = n1 - n2;
    resultBox.innerText = `Result: ${res}`;
})
//乘法
document.getElementById('mul').addEventListener('click',function(){
    let n1 = Number(num1Input.value);
    let n2 = Number(num2Input.value);
    let res = n1 * n2;
    resultBox.innerText = `Result: ${res}`;
})
//除法，包含if判断防止除以0
document.getElementById('div').addEventListener('click',function(){
    let n1 = Number(num1Input.value);
    let n2 = Number(num2Input.value);
    if(n2 == 0){
        resultBox.innerText = "Error: Cannot divide by zero";
    }else{
        let res = n1 / n2;
        resultBox.innerText = `Result: ${res}`;
    }
})
</script>
</body>
</html>
